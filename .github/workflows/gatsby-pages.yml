name: Deploy Gatsby blog
on:
  push:
    branches: [master]
    paths: ['gatsby-blog/**', '.github/workflows/gatsby-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatsby-blog
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
      GATSBY_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gatsby-blog/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gatsby-blog/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
